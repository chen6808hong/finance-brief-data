<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1b4a8a">
<title>财经晨昏简报</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --line:#e4e8f0; --line2:#eef1f6;
  --tx:#1a2333; --tx2:#5a6478; --tx3:#8a93a6;
  --brand:#1b4a8a; --brand2:#2f6bbd; --brandbg:#eaf1fb;
  --up:#d9382d; --upbg:#fdeceb;      /* 国内习惯：涨/利好 红 */
  --down:#0f8a52; --downbg:#e8f6ef;  /* 跌/利空 绿 */
  --neu:#7a839a; --neubg:#f0f2f6;
  --warn:#b8791a; --warnbg:#fdf4e3;
  --r:14px; --sh:0 1px 3px rgba(20,35,70,.06),0 6px 18px rgba(20,35,70,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
}
.wrap{max-width:900px;margin:0 auto;padding:0 12px}
a{color:var(--brand2);text-decoration:none}

/* ---------- Header ---------- */
header{
  background:linear-gradient(160deg,#173f78 0%,#1b4a8a 45%,#27599c 100%);
  color:#fff;padding:calc(16px + env(safe-area-inset-top)) 0 18px;
}
.hd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hd-t{font-size:20px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.hd-t svg{opacity:.9}
.hd-sub{font-size:12.5px;opacity:.82;margin-top:5px}
.hd-acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.hbtn{
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);color:#fff;
  border-radius:9px;padding:0 12px;height:36px;min-width:44px;font-size:13px;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;font-family:inherit
}
.hbtn:active{background:rgba(255,255,255,.28)}

/* ---------- Notice ---------- */
.notice{
  background:var(--warnbg);border:1px solid #f0dfba;color:#7d5410;
  border-radius:10px;padding:9px 12px;font-size:12.5px;margin-top:12px;
  display:flex;gap:8px;align-items:flex-start
}

/* ---------- Section ---------- */
.sec{margin-top:16px}
.sec-h{display:flex;align-items:center;gap:8px;margin:0 2px 9px}
.sec-h b{font-size:16px;font-weight:700}
.sec-h .bar{width:3px;height:15px;border-radius:2px;background:var(--brand)}
.sec-h .cnt{font-size:11.5px;color:var(--tx3);font-weight:400;margin-left:auto}

/* ---------- Market cards ---------- */
.mk{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.mkc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 9px;box-shadow:var(--sh)}
.mkc .n{font-size:11.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkc .v{font-size:16px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.mkc .c{font-size:12px;font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}
.r{color:var(--up)} .g{color:var(--down)} .n0{color:var(--neu)}
.mkGrid{display:flex;flex-direction:column;gap:10px;margin-top:2px}
.mkg{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:11px 11px 12px}
.mkg-h{display:flex;align-items:center;gap:7px;margin:0 2px 9px}
.mkg-h b{font-size:13.5px;font-weight:700}
.mkg-h .n{font-size:11px;color:var(--brand);background:var(--brandbg);padding:1px 7px;border-radius:9px;font-weight:600;margin-left:auto}

/* ---------- Focus ---------- */
.focus{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.fi{display:flex;gap:10px;padding:12px 13px;border-bottom:1px solid var(--line2)}
.fi:last-child{border-bottom:0}
.fi .num{
  flex:0 0 22px;height:22px;border-radius:7px;background:var(--brand);color:#fff;
  font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px
}
.fi .bd{flex:1;min-width:0}
.fi .t{font-size:14.5px;font-weight:600;line-height:1.45}
.fi .d{font-size:13px;color:var(--tx2);margin-top:4px}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);
  background:var(--card);color:var(--tx2);font-size:13.5px;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:5px
}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.tab .b{font-size:11px;opacity:.7}

.search{
  width:100%;height:42px;border:1px solid var(--line);border-radius:11px;background:var(--card);
  padding:0 12px;font-size:16px;color:var(--tx);font-family:inherit;margin-top:8px
}
.search:focus{outline:none;border-color:var(--brand2)}

/* ---------- Group (板块分组) ---------- */
.grp{margin-top:14px}
.grp:first-child{margin-top:10px}
.grp-h{display:flex;align-items:center;gap:7px;margin:0 2px 8px}
.grp-h .dot{width:6px;height:6px;border-radius:50%;background:var(--brand);flex:0 0 6px}
.grp-h b{font-size:14px;font-weight:700}
.grp-h .n{font-size:11.5px;color:var(--tx3);background:var(--brandbg);color:var(--brand);
  padding:1px 7px;border-radius:9px;font-weight:600}
.grp-col{display:flex;flex-direction:column;gap:9px}

/* ---------- 横向滑动区 ---------- */
.sw-hint{
  display:flex;align-items:center;gap:6px;margin:9px 2px 6px;
  font-size:12px;color:var(--tx3)
}
.sw-hint svg{flex:0 0 13px;opacity:.75}
.sw-hint .sp{margin-left:auto}
.sw-more{
  height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--line);
  background:var(--card);color:var(--brand);font-size:12px;font-family:inherit;
  cursor:pointer;font-weight:600
}
.swipe{
  display:flex;gap:9px;overflow-x:auto;padding:2px 2px 10px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:#cfd6e2 transparent
}
.swipe::-webkit-scrollbar{height:5px}
.swipe::-webkit-scrollbar-thumb{background:#cfd6e2;border-radius:3px}
.swipe::-webkit-scrollbar-track{background:transparent}
.swipe .it{flex:0 0 86%;max-width:430px;scroll-snap-align:start}
@media (min-width:769px){ .swipe .it{flex:0 0 44%} }

/* ---------- News list ---------- */
.list{margin-top:10px;display:flex;flex-direction:column;gap:9px}
.list.grouped{gap:0;margin-top:2px}
.it{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;box-shadow:var(--sh);position:relative}
.it.read{opacity:.62}
.it-h{display:flex;align-items:flex-start;gap:8px}
.imp{display:inline-flex;gap:1px;align-self:center;margin-right:5px;flex:0 0 auto}
.imp svg{width:12px;height:12px;display:block}
.it-n{
  flex:0 0 auto;min-width:22px;height:20px;padding:0 5px;border-radius:6px;background:var(--brandbg);
  color:var(--brand);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px;
  font-variant-numeric:tabular-nums
}
.it-t{flex:1;font-size:14.5px;font-weight:600;line-height:1.45;min-width:0}
.star{flex:0 0 34px;height:34px;margin:-6px -6px 0 0;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.star svg{width:17px;height:17px}
.it-d{font-size:13px;color:var(--tx2);margin-top:6px;padding-left:30px}
.it-f{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;padding-left:30px;align-items:center}
.pill{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600;line-height:1.6}
.p-up{background:var(--upbg);color:var(--up)}
.p-dn{background:var(--downbg);color:var(--down)}
.p-nu{background:var(--neubg);color:var(--neu)}
.p-lv{background:#eef3fb;color:#3a6ba8}
.p-sc{background:#f5f2fb;color:#6d5aa8}
.p-src{font-size:11px;color:var(--tx3);margin-left:auto}
.rdbtn{
  margin-top:9px;margin-left:30px;height:28px;padding:0 11px;border-radius:8px;border:1px solid var(--line);
  background:#fafbfd;color:var(--tx2);font-size:12px;cursor:pointer;font-family:inherit
}
.rdbtn:active{background:#eef1f6}

/* ---------- Opportunity ---------- */
.opp{display:flex;flex-direction:column;gap:9px}
.oc{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--brand2);border-radius:12px;padding:12px 13px;box-shadow:var(--sh)}
.oc h4{margin:0;font-size:14.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.oc .lv{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600}
.lv-a{background:var(--upbg);color:var(--up)}
.lv-b{background:#fdf4e3;color:var(--warn)}
.lv-c{background:var(--neubg);color:var(--neu)}
.oc p{margin:7px 0 0;font-size:13px;color:var(--tx2)}
.oc .tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}

/* ---------- Risk ---------- */
.risk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;box-shadow:var(--sh)}
.risk ol{margin:0;padding-left:20px;font-size:13px;color:var(--tx2)}
.risk li{margin:5px 0}

/* ---------- Chart ---------- */
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;box-shadow:var(--sh)}
.chartbox svg{width:100%;height:auto;display:block}

/* ---------- Footer ---------- */
footer{margin:22px 0 0;padding:14px 0 8px;border-top:1px solid var(--line);font-size:11.5px;color:var(--tx3);line-height:1.7}
.foot-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 16px}
.foot-acts .lbl{width:100%;font-size:12.5px;color:var(--tx3);font-weight:600}
.fbtn{background:#fff;border:1px solid var(--line);color:var(--tx2);border-radius:9px;padding:0 13px;height:40px;min-width:44px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:inherit}
.fbtn:active{background:#f0f3f8}
.fbtn svg{width:14px;height:14px}

/* ---------- Bottom bar ---------- */
.bbar{
  position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);
  backdrop-filter:saturate(1.6) blur(10px);border-top:1px solid var(--line);
  padding:7px 10px calc(7px + env(safe-area-inset-bottom));z-index:40
}
.bbar-in{max-width:900px;margin:0 auto;display:flex;gap:7px}
.bb{
  flex:1;height:46px;border-radius:11px;border:1px solid var(--line);background:#fafbfd;
  color:var(--tx2);font-size:12px;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px
}
.bb.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.bb svg{width:17px;height:17px}
.bb:active{filter:brightness(.94)}

/* ---------- Modal ---------- */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:18px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:16px;padding:18px;max-width:400px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{margin:0 0 8px;font-size:16px}
.modal p{margin:0 0 14px;font-size:13.5px;color:var(--tx2)}
.mrow{display:flex;gap:8px}
.mbtn{flex:1;height:44px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:14px;cursor:pointer;font-family:inherit;color:var(--tx)}
.mbtn.danger{background:var(--up);border-color:var(--up);color:#fff}
.mbtn.pri{background:var(--brand);border-color:var(--brand);color:#fff}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:rgba(26,35,51,.94);color:#fff;
  padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:80;opacity:0;pointer-events:none;transition:opacity .22s
}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--tx3);font-size:13.5px;padding:30px 0}

@media (max-width:768px){
  .mk{grid-template-columns:repeat(3,1fr);gap:7px}
  .mkc{padding:9px 8px 8px}
  .mkc .v{font-size:15px}
  .mkc .c{font-size:11.5px}
  .hd-t{font-size:18px}
  .it-d,.it-f,.rdbtn{padding-left:0;margin-left:0}
}
@media (min-width:769px){
  .wrap{padding:0 16px}
}
</style>
</head>

  <div class="notice">

</div>

<div class="bbar">

    <button class="bb" onclick="askClear()">

</div>

<div class="mask" id="mask"><div class="modal">

const BRIEF_SOURCES = [
  "brief.json",
  "https://cdn.jsdelivr.net/gh/chen6808hong/finance-brief-data@main/brief.json",
  "https://raw.githubusercontent.com/chen6808hong/finance-brief-data/main/brief.json"
];
let BRIEF = BRIEF_FALLBACK;
let BRIEF_SRC = "内置快照(08-05)";
function fetchBrief(url){
  const sep = url.indexOf('?')<0 ? '?' : '&';
  return fetch(url + sep + "t=" + Date.now(), {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
    .then(function(d){ if(d && d.date){ return d; } throw new Error('invalid payload'); });
}
function loadBrief(){
  let chain = Promise.reject(new Error('init'));
  BRIEF_SOURCES.forEach(function(u){ chain = chain.catch(function(){ return fetchBrief(u); }); });
  return chain
    .then(function(d){ BRIEF = d; BRIEF_SRC = "线上最新"; return d; })
    .catch(function(e){ BRIEF = BRIEF_FALLBACK; BRIEF_SRC = "内置快照(08-05)，线上拉取失败"; return BRIEF; });
}

function load(k,def){ try{ const v=localStorage.getItem(KEY+k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function save(k,v){ try{ localStorage.setItem(KEY+k, JSON.stringify(v)); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800); }

/* ---------- 板块条形图（内联 SVG 手写） ---------- */
function renderChart(){
  const up = BRIEF.sectors.up, dn = BRIEF.sectors.down;
  const rows = up.concat(dn);
  const max = Math.max.apply(null, rows.map(r=>Math.abs(r.v)));
  const W=680, LW=96, RW=54, PL=LW, PR=W-RW;
  const axis=(PL+PR)/2, half=(PR-PL)/2-4;
  const rh=25, gap=6, H=rows.length*(rh+gap)+30;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="行业涨跌幅">';
  s+='<line x1="'+axis+'" y1="6" x2="'+axis+'" y2="'+(H-22)+'" stroke="#dfe4ec" stroke-width="1"/>';
  rows.forEach((r,i)=>{
    const y=6+i*(rh+gap), w=Math.abs(r.v)/max*half;
    const pos=r.v>=0;
    const x=pos?axis:axis-w;
    const col=pos?'#d9382d':'#0f8a52';
    const bg =pos?'#fdeceb':'#e8f6ef';
    s+='<rect x="'+(axis-half)+'" y="'+y+'" width="'+(half*2)+'" height="'+rh+'" rx="5" fill="'+bg+'" opacity=".45"/>';
    s+='<rect x="'+x+'" y="'+y+'" width="'+Math.max(w,2)+'" height="'+rh+'" rx="5" fill="'+col+'"/>';
    s+='<text x="'+(LW-10)+'" y="'+(y+rh/2+4.5)+'" text-anchor="end" font-size="12.5" fill="#5a6478" font-family="-apple-system,sans-serif">'+esc(r.n)+'</text>';
    s+='<text x="'+(W-8)+'" y="'+(y+rh/2+4.5)+'" text-anchor="end" font-size="12.5" font-weight="600" fill="'+col+'" font-family="-apple-system,sans-serif">'+(pos?'+':'')+r.v.toFixed(2)+'</text>';
  });
  s+='<text x="'+axis+'" y="'+(H-6)+'" text-anchor="middle" font-size="11" fill="#8a93a6" font-family="-apple-system,sans-serif">红涨绿跌 · 申万行业指数</text>';
  s+='</svg>';
  document.getElementById('chartBox').innerHTML=s;
}

/* ---------- Tab ---------- */
function renderTabs(){
  document.getElementById('tabs').innerHTML = CATS.map(c=>{
    const n = c.k==='all' ? BRIEF.items.length : BRIEF.items.filter(i=>i.c===c.k).length;
    return '<button class="tab'+(state.cat===c.k?' on':'')+'" onclick="setCat(\''+c.k+'\')">'+c.n+'<span class="b">'+n+'</span></button>';
  }).join('');
}
function setCat(k){ state.cat=k; renderTabs(); render(); }

/* ---------- 列表：每个板块默认前 3 条，其余横向滑动 ---------- */
const TOP_N = 3;
const CATNAME = {macro:"宏观政策", cn:"国内市场", corp:"公司产业", intl:"国际市场"};
const SW_ICON = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7 3 12l5 5"/><path d="M16 7l5 5-5 5"/><path d="M3 12h18"/></svg>';

const STAR_PATH = "M11.5 3.2 14 8.3l5.6.8-4 3.9 1 5.6-5.1-2.7L6.4 18.6l1-5.6-4-3.9 5.6-.8z";
function impStars(n){
  n = n|0;
  if(n<1) return '';
  let s = '<span class="imp" title="重要程度 '+n+' 星">';
  for(let k=0;k<n;k++){
    s += '<svg viewBox="0 0 24 24" fill="#f0883e" stroke="#f0883e" stroke-width="1.4" stroke-linejoin="round"><path d="'+STAR_PATH+'"/></svg>';
  }
  return s+'</span>';
}

function itemHTML(i){
  const gp = i.g>0?'<span class="pill p-up">利好</span>' : (i.g<0?'<span class="pill p-dn">利空</span>':'<span class="pill p-nu">中性</span>');
  const sc = (i.s||[]).map(x=>'<span class="pill p-sc">'+esc(x)+'</span>').join('');
  const fav = state.fav[i.id];
  const starSvg = '<svg viewBox="0 0 24 24" fill="'+(fav?'#e8a33d':'none')+'" stroke="'+(fav?'#e8a33d':'#b6bdcb')+'" stroke-width="2" stroke-linejoin="round"><path d="M11.5 3.2 14 8.3l5.6.8-4 3.9 1 5.6-5.1-2.7L6.4 18.6l1-5.6-4-3.9 5.6-.8z"/></svg>';
  return '<div class="it'+(state.read[i.id]?' read':'')+'" id="it'+i.id+'">'
    + '<div class="it-h">'+impStars(i.imp)+'<div class="it-n">'+i.id+'</div><div class="it-t">'+esc(i.t)+'</div>'
    + '<button class="star" onclick="toggleStar('+i.id+')" aria-label="收藏">'+starSvg+'</button></div>'
    + '<div class="it-d">'+esc(i.d)+'</div>'
    + '<div class="it-f">'+gp+'<span class="pill p-lv">'+esc(i.lv)+'</span>'+sc+'<span class="p-src">'+esc(i.src)+'</span></div>'
    + '<button class="rdbtn" onclick="toggleRead('+i.id+')">'+(state.read[i.id]?'标为未读':'标记已读')+'</button>'
    + '</div>';
}

function groupHTML(key, arr){
  const head = '<div class="grp-h"><span class="dot"></span><b>'+CATNAME[key]+'</b><span class="n">'+arr.length+' 条</span></div>';
  if(arr.length<=TOP_N){
    return '<div class="grp">'+head+'<div class="grp-col">'+arr.map(itemHTML).join('')+'</div></div>';
  }
  if(state.exp[key]){
    return '<div class="grp">'+head
      + '<div class="grp-col">'+arr.map(itemHTML).join('')+'</div>'
      + '<div class="sw-hint"><span class="sp"></span>'
      + '<button class="sw-more" onclick="toggleExp(\''+key+'\')">收起，只看前 '+TOP_N+' 条</button></div>'
      + '</div>';
  }
  const rest = arr.slice(TOP_N);
  return '<div class="grp">'+head
    + '<div class="grp-col">'+arr.slice(0,TOP_N).map(itemHTML).join('')+'</div>'
    + '<div class="sw-hint">'+SW_ICON+'<span>还有 '+rest.length+' 条，左右滑动查看</span><span class="sp"></span>'
    + '<button class="sw-more" onclick="toggleExp(\''+key+'\')">展开全部</button></div>'
    + '<div class="swipe" data-k="'+key+'">'+rest.map(itemHTML).join('')+'</div>'
    + '</div>';
}
function toggleExp(k){ state.exp[k]=!state.exp[k]; render(); }

function grabScroll(){
  const m={}; document.querySelectorAll('.swipe').forEach(el=>{ m[el.getAttribute('data-k')]=el.scrollLeft; }); return m;
}
function putScroll(m){
  document.querySelectorAll('.swipe').forEach(el=>{
    const v=m[el.getAttribute('data-k')]; if(v) el.scrollLeft=v;
  });
}

function render(){
  const sp = grabScroll();
  const q = (document.getElementById('q').value||'').trim().toLowerCase();
  let arr = BRIEF.items.filter(i=>{
    if(state.cat!=='all' && i.c!==state.cat) return false;
    if(state.favOnly && !state.fav[i.id]) return false;
    if(q){
      const hay=(i.t+i.d+(i.s||[]).join('')+i.src).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
  const unread = arr.filter(i=>!state.read[i.id]).length;
  document.getElementById('listCnt').textContent = arr.length+" 条 · 未读 "+unread;

  const box = document.getElementById('list');
  if(!arr.length){ box.className='list'; box.innerHTML='<div class="empty">没有符合条件的资讯</div>'; return; }

  /* 搜索或只看收藏时结果本就精简，直接完整平铺 */
  if(q || state.favOnly){
    box.className='list';
    box.innerHTML = arr.map(itemHTML).join('');
    return;
  }

  box.className='list grouped';
  const keys = state.cat==='all' ? ['macro','cn','corp','intl'] : [state.cat];
  box.innerHTML = keys.map(k=>{
    const sub = arr.filter(i=>i.c===k).sort((a,b)=> (b.imp||0)-(a.imp||0) || (a.id-b.id));
    return sub.length ? groupHTML(k, sub) : '';
  }).join('');
  putScroll(sp);
}

function toggleRead(id){ state.read[id]=!state.read[id]; if(!state.read[id]) delete state.read[id]; save("read",state.read); render(); }
function toggleStar(id){ state.fav[id]=!state.fav[id]; if(!state.fav[id]) delete state.fav[id]; save("fav",state.fav); render(); }
function markAllRead(){ BRIEF.items.forEach(i=>state.read[i.id]=true); save("read",state.read); render(); toast("已全部标记为已读"); }
function toggleFav(){ state.favOnly=!state.favOnly; document.getElementById('favTx').textContent = state.favOnly?'显示全部':'只看收藏'; render(); }
function gotoTop(){
  var el = document.scrollingElement || document.documentElement || document.body;
  if(el && typeof el.scrollTo==="function"){ try{ el.scrollTo({top:0,behavior:"smooth"}); return; }catch(e){} }
  if(el) el.scrollTop = 0;
  if(window.scrollY || window.pageYOffset) window.scrollTo(0,0);
}

/* ---------- 投资机会 / 风险 ---------- */
function renderOpp(){
  document.getElementById('oppBox').innerHTML = BRIEF.opps.map(o=>
    '<div class="oc"><h4>'+esc(o.t)+'<span class="lv '+o.lvc+'">'+esc(o.lv)+'</span></h4>'
    + '<p>'+esc(o.d)+'</p>'
    + '<div class="tags">'+(o.tags||[]).map(t=>'<span class="pill p-sc">'+esc(t)+'</span>').join('')+'</div>'
    + '<p style="color:#b8791a;font-size:12.5px">风险：'+esc(o.risk)+'</p></div>'
  ).join('');
  document.getElementById('riskList').innerHTML = BRIEF.risks.map(r=>'<li>'+esc(r)+'</li>').join('');
}

/* ---------- 导入导出 ---------- */
function exportJSON(){
  const payload = { app:"wb_finbrief", version:1, exportedAt:new Date().toISOString(),
    brief:BRIEF, marks:{read:state.read, fav:state.fav} };
  dl(JSON.stringify(payload,null,2), "财经简报_"+BRIEF.date+".json", "application/json");
  toast("已导出 JSON 备份");
}
function exportMD(){
  let s = "# 财经简报 "+BRIEF.date+" "+BRIEF.weekday+"\n更新于 "+BRIEF.updated+"\n\n## 市场速览\n";
  (BRIEF.marketGroups||[{name:"",items:BRIEF.market||[]}]).forEach(g=>{
    if(g.name) s += "\n### "+g.name+"\n";
    (g.items||[]).forEach(m=> s += "- "+m.n+"："+m.v+"（"+m.c+"）\n");
  });
  s += "\n## 今日必看\n";
  BRIEF.focus.forEach((f,i)=> s += (i+1)+". "+f.t+"\n   "+f.d+"\n");
  const map={macro:"宏观政策",cn:"国内市场",corp:"公司产业",intl:"国际市场"};
  Object.keys(map).forEach(k=>{
    s += "\n## "+map[k]+"\n";
    BRIEF.items.filter(i=>i.c===k).forEach(i=>{
      s += i.id+". ["+(i.g>0?"利好":i.g<0?"利空":"中性")+"|"+i.lv+"] "+i.t+"\n   "+i.d+"\n   板块："+(i.s||[]).join("、")+" | 来源："+i.src+"\n";
    });
  });
  s += "\n## 投资机会分析\n";
  BRIEF.opps.forEach(o=> s += "- 【"+o.lv+"】"+o.t+"\n  "+o.d+"\n  关注："+(o.tags||[]).join("、")+"\n  风险："+o.risk+"\n");
  s += "\n## 风险提示\n";
  BRIEF.risks.forEach((r,i)=> s += (i+1)+". "+r+"\n");
  s += "\n"+BRIEF.sources+"\n免责声明：本简报由公开信息自动汇编，不构成投资建议。\n";
  dl(s, "财经简报_"+BRIEF.date+".txt", "text/plain;charset=utf-8");
  toast("已导出文本版");
}
function dl(content,name,type){
  const b=new Blob([content],{type:type}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(u); a.remove();},400);
}
function importJSON(e){
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=function(){
    try{
      const d=JSON.parse(r.result);
      if(d.marks){ state.read=d.marks.read||{}; state.fav=d.marks.fav||{}; save("read",state.read); save("fav",state.fav); }
      if(d.brief && d.brief.items){ Object.assign(BRIEF, d.brief); renderHead(); renderMarket(); renderFocus(); renderChart(); renderOpp(); renderTabs(); }
      render(); toast("导入成功");
    }catch(err){ toast("文件格式不正确"); }
    e.target.value="";
  };
  r.readAsText(f);
}

/* ---------- 弹窗 ---------- */
let okFn=null;
function openModal(t,b,fn){ document.getElementById('mTitle').textContent=t; document.getElementById('mBody').textContent=b; okFn=fn; document.getElementById('mask').classList.add('on'); }
function closeModal(){ document.getElementById('mask').classList.remove('on'); okFn=null; }
document.getElementById('mOk').onclick=function(){ if(okFn) okFn(); closeModal(); };
document.getElementById('mask').onclick=function(e){ if(e.target.id==='mask') closeModal(); };
function askClear(){
  openModal("清空本地记录","将清除所有已读标记和收藏记录，此操作不可恢复。简报内容本身不会被删除。确定继续吗？",function(){
    state.read={}; state.fav={}; save("read",{}); save("fav",{}); render(); toast("已清空本地记录");
  });
}

/* ---------- 备份提醒 ---------- */
function backupHint(){
  const n = Object.keys(state.read).length + Object.keys(state.fav).length;
  if(n>=30){ document.getElementById('noticeTx').textContent = "本地记录已积累 "+n+" 条，建议点击上方「导出 JSON 备份」保存一份。"; }
}

/* ---------- 启动 ---------- */
function refreshBrief(){
  return loadBrief().then(function(){
    renderHead(); renderMarket(); renderFocus(); renderChart(); renderTabs(); renderOpp(); render(); updateSrcHint();
    return BRIEF;
  });
}
refreshBrief().then(backupHint);
// 线上自动刷新：每5分钟静默重新拉取最新数据并重渲染（保留已读/收藏），实现打开后持续自更新
setInterval(function(){
  loadBrief().then(function(){
    renderHead(); renderMarket(); renderFocus(); renderChart(); renderTabs(); renderOpp(); render(); updateSrcHint();
  });
}, 5*60*1000);
</script>
